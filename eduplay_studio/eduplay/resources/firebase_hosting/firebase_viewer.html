  <script>
    (function(){
      function $(s){ return document.querySelector(s); }
      function setStatus(msg){
        var el = $('#status');
        if(el){ el.textContent = msg; }
      }
      function slug(){
        try {
          var p = String(location.pathname||'').replace(/^\//,'').replace(/\/$/,'');
          if (p) return p;
          var u = new URL(location.href);
          return u.searchParams.get('key')||'';
        } catch(e){ return ''; }
      }
      function decodeBase64ToUint8(b64){
        try{
          var bin = atob(b64);
          var len = bin.length;
          var bytes = new Uint8Array(len);
          for(var i=0;i<len;i++){ bytes[i] = bin.charCodeAt(i)&255; }
          return bytes;
        }catch(e){ return new Uint8Array(0); }
      }
      function hexToBytes(hex){
        try{
          var clean = String(hex||'').replace(/[^0-9a-f]/gi, '');
          if(!clean || clean.length < 2){ return new Uint8Array(0); }
          if(clean.length % 2){ clean = '0' + clean; }
          var out = new Uint8Array(clean.length / 2);
          for(var i=0;i<clean.length;i+=2){
            out[i/2] = parseInt(clean.slice(i, i+2), 16) & 255;
          }
          return out;
        }catch(e){
          return new Uint8Array(0);
        }
      }
      function xorBytes(bytes, keyHex){
        try{
          var key = hexToBytes(keyHex);
          if(!key.length){ return bytes; }
          var out = new Uint8Array(bytes.length);
          for(var i=0;i<bytes.length;i++){
            out[i] = (bytes[i] ^ key[i % key.length]) & 255;
          }
          return out;
        }catch(e){
          return bytes;
        }
      }
      function renderHtmlText(htmlText){
        try{
          var frame = $('#frame');
          if(!frame){ return; }
          var blob = new Blob([String(htmlText||'')], {type:'text/html'});
          var url = URL.createObjectURL(blob);
          frame.src = url;
        }catch(e){
          setStatus('Load error');
        }
      }
      function gunzipBytesToText(bytes, cb){
        try{
          if(typeof DecompressionStream === 'function'){
            var ds = new DecompressionStream('gzip');
            var s = new Blob([bytes]).stream().pipeThrough(ds);
            new Response(s).text().then(function(txt){ cb(null, txt); }).catch(function(err){ cb(err||new Error('gunzip failed')); });
          } else {
            cb(new Error('DecompressionStream not supported'));
          }
        }catch(e){
          cb(e);
        }
      }
      function gunzipBytesToTextPromise(bytes){
        return new Promise(function(resolve, reject){
          gunzipBytesToText(bytes, function(err, txt){
            if(err){ reject(err); return; }
            resolve(String(txt||''));
          });
        });
      }
      function gunzipToText(b64, cb){
        gunzipBytesToText(decodeBase64ToUint8(b64), cb);
      }
      function decodePayloadToText(base64Data, encoding){
        return new Promise(function(resolve, reject){
          try{
            var enc = String(encoding||'base64').toLowerCase();
            if(enc === 'gzip+base64'){
              gunzipToText(String(base64Data||''), function(err, txt){
                if(err || !txt){ reject(err || new Error('decode failed')); return; }
                resolve(String(txt||''));
              });
              return;
            }
            resolve(decodeURIComponent(escape(window.atob(String(base64Data||'')))));
          }catch(e){
            reject(e);
          }
        });
      }
      function runGameBase64(base64Data, encoding){
        decodePayloadToText(base64Data, encoding).then(function(htmlText){
          renderHtmlText(htmlText);
        }).catch(function(){
          setStatus('Load error');
        });
      }
      function loadGameFromFileUrl(fileUrl, encoding){
        var enc = String(encoding||'text').toLowerCase();
        setStatus('Loading game file...');
        return fetch(String(fileUrl||''), { cache: 'no-store' }).then(function(resp){
          if(!resp || !resp.ok){ throw new Error('fetch failed'); }
          if(enc === 'gzip'){
            return resp.arrayBuffer().then(function(buf){
              return new Promise(function(resolve, reject){
                gunzipBytesToText(new Uint8Array(buf), function(err, txt){
                  if(err || !txt){ reject(err || new Error('gunzip failed')); return; }
                  resolve(txt);
                });
              });
            });
          }
          return resp.text();
        });
      }
      function joinChunks(j, fieldName){
        try{
          var c = j && (fieldName ? j[fieldName] : (j.content_chunks || j.chunks));
          if(!c) return '';
          var keys = Object.keys(c);
          if(!keys.length) return '';
          keys.sort(function(a,b){ return parseInt(a,10)-parseInt(b,10); });
          var out = '';
          for(var i=0;i<keys.length;i++){
            out += String(c[keys[i]]||'');
          }
          return out;
        }catch(e){
          return '';
        }
      }
      function fetchLibraryManifest(db, assetPackProfile){
        var profile = String(assetPackProfile || '').trim().toLowerCase();
        if(!profile){
          return Promise.resolve({});
        }
        return db.ref('asset_pack_libraries/' + profile).once('value').then(function(snap){
          return snap.val() || {};
        }).catch(function(){
          return {};
        });
      }
      function resolveAssetPackKey(db, assetPackKey, assetPackProfile){
        var requestedKey = String(assetPackKey || '');
        var profile = String(assetPackProfile || '').trim().toLowerCase();
        if(!profile){
          return Promise.resolve(requestedKey);
        }
        return fetchLibraryManifest(db, profile).then(function(manifest){
          var versions = (manifest && manifest.versions) ? manifest.versions : {};
          if(requestedKey){
            var versionInfo = versions && versions[requestedKey] ? versions[requestedKey] : null;
            if(versionInfo){
              return String((versionInfo.storage_key || versionInfo.key || requestedKey) || '');
            }
            if(manifest && manifest.known_keys && manifest.known_keys[requestedKey]){
              return requestedKey;
            }
            return requestedKey;
          }
          return String((manifest && (manifest.latest_key || manifest.key)) || '');
        }).catch(function(){
          return requestedKey || '';
        });
      }
      function loadAssetPackPayload(db, resolvedKey){
        var key = String(resolvedKey || '');
        if(!key){
          return Promise.resolve({});
        }
        setStatus('Loading shared assets...');
        return db.ref('asset_packs/' + key).once('value').then(function(snap){
          var j = snap.val();
          if(!j){ return {}; }
          var packed = joinChunks(j, 'chunks');
          if(!packed){ return {}; }
          var enc = String((j||{}).encoding || 'xor+gzip+base64').toLowerCase();
          if(enc === 'xor+gzip+base64'){
            var encryptedBytes = decodeBase64ToUint8(String(packed||''));
            var decryptedBytes = xorBytes(encryptedBytes, key);
            return gunzipBytesToTextPromise(decryptedBytes).then(function(txt){
              var parsed = JSON.parse(String(txt||'{}'));
              return (parsed && parsed.assets) ? parsed.assets : {};
            });
          }
          return decodePayloadToText(String(packed||''), enc).then(function(txt){
            var parsed = JSON.parse(String(txt||'{}'));
            return (parsed && parsed.assets) ? parsed.assets : {};
          });
        }).catch(function(){
          return {};
        });
      }
      function loadAssetPack(db, assetPackKey, assetPackProfile){
        var requestedKey = String(assetPackKey || '');
        return resolveAssetPackKey(db, requestedKey, assetPackProfile).then(function(resolvedKey){
          var candidates = [];
          // Always prefer the key embedded in the game metadata.
          // Older library manifests may carry stale indirections via `storage_key`.
          if(requestedKey){ candidates.push(requestedKey); }
          if(resolvedKey && candidates.indexOf(resolvedKey) === -1){
            candidates.push(resolvedKey);
          }
          function tryLoad(index){
            if(index >= candidates.length){
              return Promise.resolve({});
            }
            return loadAssetPackPayload(db, candidates[index]).then(function(assets){
              if(assets && Object.keys(assets).length){
                return assets;
              }
              return tryLoad(index + 1);
            });
          }
          return tryLoad(0);
        });
      }
      function applyAssetPack(htmlText, assets){
        try{
          var out = String(htmlText||'');
          var map = assets || {};
          Object.keys(map).forEach(function(token){
            out = out.split(token).join(String(map[token]||''));
          });
          return out;
        }catch(e){
          return String(htmlText||'');
        }
      }
      function viewerLang(){
        try{
          var l = String((navigator.language || navigator.userLanguage || 'en')).toLowerCase();
          if(l.indexOf('vi') === 0) return 'vi';
          if(l.indexOf('fr') === 0) return 'fr';
          if(l.indexOf('es') === 0) return 'es';
          if(l.indexOf('de') === 0) return 'de';
        }catch(e){}
        return 'en';
      }
      var MISSING_STRINGS = {
        vi: { expiredTitle: 'Link đã hết hạn', missingTitle: 'Không tìm thấy bài', expiredDesc: 'Link này đã hết hạn sử dụng.',
              missingDesc: 'Bài này không còn trên hệ thống (có thể đã bị xóa).',
              contactHint: 'Gửi link bên dưới cho người tạo để nhờ gia hạn hoặc gửi lại link mới.',
              copy: 'Copy link', retry: 'Thử lại', copied: 'Đã copy link!' },
        en: { expiredTitle: 'Link expired', missingTitle: 'Game not found', expiredDesc: 'This link has expired.',
              missingDesc: 'This game is no longer on the system (it may have been deleted).',
              contactHint: 'Send the link below to the creator to ask for a renewal or a new link.',
              copy: 'Copy link', retry: 'Retry', copied: 'Link copied!' },
        fr: { expiredTitle: 'Lien expiré', missingTitle: 'Jeu introuvable', expiredDesc: 'Ce lien a expiré.',
              missingDesc: 'Ce jeu n’est plus sur le système (il a peut-être été supprimé).',
              contactHint: 'Envoyez le lien ci-dessous au créateur pour demander un renouvellement ou un nouveau lien.',
              copy: 'Copier le lien', retry: 'Réessayer', copied: 'Lien copié !' },
        es: { expiredTitle: 'Enlace caducado', missingTitle: 'Juego no encontrado', expiredDesc: 'Este enlace ha caducado.',
              missingDesc: 'Este juego ya no está en el sistema (puede haber sido eliminado).',
              contactHint: 'Envíe el siguiente enlace al creador para pedir una renovación o un enlace nuevo.',
              copy: 'Copiar enlace', retry: 'Reintentar', copied: '¡Enlace copiado!' },
        de: { expiredTitle: 'Link abgelaufen', missingTitle: 'Spiel nicht gefunden', expiredDesc: 'Dieser Link ist abgelaufen.',
              missingDesc: 'Dieses Spiel ist nicht mehr im System (es wurde möglicherweise gelöscht).',
              contactHint: 'Senden Sie den untenstehenden Link an den Ersteller, um eine Verlängerung oder einen neuen Link zu bitten.',
              copy: 'Link kopieren', retry: 'Erneut versuchen', copied: 'Link kopiert!' }
      };
      function escapeHtml(s){
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function prettyNameFromSlug(slug){
        try{
          var t = String(slug || '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
          if(!t) return 'EduPlay Game';
          return t.split(' ').map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
        }catch(e){ return 'EduPlay Game'; }
      }
      function renderMissingPage(slug, reason, meta){
        try{
          var lang = viewerLang();
          var T = MISSING_STRINGS[lang] || MISSING_STRINGS.en;
          var expired = (reason === 'expired');
          var title = expired ? T.expiredTitle : T.missingTitle;
          var desc = expired ? T.expiredDesc : T.missingDesc;
          var name = (meta && meta.name) ? String(meta.name) : prettyNameFromSlug(slug);
          var link = '';
          try{ link = location.origin + '/' + String(slug || ''); }catch(e){ link = String(slug || ''); }
          setStatus(title + ' — ' + name);
          var htmlText = '<!doctype html><html><head><meta charset="utf-8">'
            + '<meta name="viewport" content="width=device-width, initial-scale=1">'
            + '<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;'
            + 'background:linear-gradient(135deg,#E0F2FE 0%,#ECFDF3 100%);font-family:"Segoe UI",Arial,sans-serif;}'
            + '.card{background:#fff;border-radius:20px;padding:36px 40px;max-width:520px;width:min(92vw,520px);'
            + 'text-align:center;box-shadow:0 28px 60px rgba(15,23,42,.14);color:#0F172A;}'
            + '.icon{font-size:52px;}.card h1{font-size:24px;margin:12px 0 6px;}'
            + '.gname{font-weight:700;color:#7F56D9;margin-bottom:8px;word-break:break-word;}'
            + '.desc{color:#475569;font-size:14px;line-height:1.7;}'
            + '.linkbox{margin:16px 0 6px;padding:10px 12px;background:#F2F4F7;border:1px solid #E2E8F0;'
            + 'border-radius:10px;font-size:13px;word-break:break-all;color:#334155;}'
            + '.hint{color:#667085;font-size:13px;line-height:1.6;margin:8px 0 18px;}'
            + '.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}'
            + 'button{border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;}'
            + '.primary{background:#7F56D9;color:#fff;}.primary:hover{background:#8B66E9;}'
            + '.ghost{background:#F2F4F7;color:#344054;border:1px solid #D0D5DD;}</style></head><body>'
            + '<div class="card"><div class="icon">' + (expired ? '&#9200;' : '&#128196;') + '</div>'
            + '<h1>' + escapeHtml(title) + '</h1>'
            + '<div class="gname">' + escapeHtml(name) + '</div>'
            + '<div class="desc">' + escapeHtml(desc) + '</div>'
            + '<div class="linkbox">' + escapeHtml(link) + '</div>'
            + '<div class="hint">' + escapeHtml(T.contactHint) + '</div>'
            + '<div class="row"><button class="primary" onclick="try{navigator.clipboard.writeText('
            + 'document.getElementById(\'playlink\').textContent).then(function(){'
            + 'document.getElementById(\'copystatus\').textContent=' + JSON.stringify(T.copied) + ';'
            + '});}catch(e){}">' + escapeHtml(T.copy) + '</button>'
            + '<button class="ghost" onclick="location.reload()">' + escapeHtml(T.retry) + '</button></div>'
            + '<div class="hint" id="copystatus"></div>'
            + '<div id="playlink" style="display:none">' + escapeHtml(link) + '</div>'
            + '</div></body></html>';
          try{
            var frame = $('#frame');
            if(frame){
              if('srcdoc' in frame){ frame.removeAttribute('src'); frame.srcdoc = htmlText; }
              else {
                var blob = new Blob([htmlText], {type:'text/html'});
                frame.src = URL.createObjectURL(blob);
              }
            }
          }catch(e){}
        }catch(e){
          try{ setStatus('Game not found'); }catch(_e){}
        }
      }
      function loadGameWithRetry(db, key, attempt){
        var maxAttempts = 5;
        var waitMs = 400 + attempt * 500;
        setStatus(attempt ? ('Retry ' + attempt + '/' + maxAttempts + '...') : 'Loading...');
        return db.ref('games/'+key).once('value').then(function(snap){
          var j = snap.val();
          if(!j){
            if(attempt < maxAttempts){
              return new Promise(function(res){ setTimeout(res, waitMs); }).then(function(){
                return loadGameWithRetry(db, key, attempt + 1);
              });
            }
            setStatus('Game not found');
            try{ renderMissingPage(key, 'missing', null); }catch(e){}
            return;
          }
          try{
            var expAt = j && j.expires_at ? parseInt(j.expires_at, 10) : 0;
            if(expAt && Date.now() > expAt * 1000){
              setStatus('Link expired');
              try{ renderMissingPage(key, 'expired', j); }catch(e){}
              return;
            }
          }catch(e){}
          var enc = String((j||{}).encoding||'base64').toLowerCase();
          var htmlPromise = null;
          if(j && j.file_url){
            htmlPromise = loadGameFromFileUrl(j.file_url, enc);
          } else if(j && j.html_base64){
            htmlPromise = decodePayloadToText(j.html_base64, enc);
          } else if(j && j.content_chunks){
            var contentAll = joinChunks(j, 'content_chunks');
            if(!contentAll){
              if(attempt < maxAttempts){
                return new Promise(function(res){ setTimeout(res, waitMs); }).then(function(){
                  return loadGameWithRetry(db, key, attempt + 1);
                });
              }
              setStatus('Game not found');
              try{ renderMissingPage(key, 'missing', j); }catch(e){}
              return;
            }
            htmlPromise = decodePayloadToText(contentAll, enc);
          } else if (j && j.chunks){
            var all = joinChunks(j, 'chunks');
            if(!all){
              if(attempt < maxAttempts){
                return new Promise(function(res){ setTimeout(res, waitMs); }).then(function(){
                  return loadGameWithRetry(db, key, attempt + 1);
                });
              }
              setStatus('Game not found');
              try{ renderMissingPage(key, 'missing', j); }catch(e){}
              return;
            }
            htmlPromise = decodePayloadToText(all, enc);
          } else {
            if(attempt < maxAttempts){
              return new Promise(function(res){ setTimeout(res, waitMs); }).then(function(){
                return loadGameWithRetry(db, key, attempt + 1);
              });
            }
            setStatus('Game not found');
            try{ renderMissingPage(key, 'missing', j); }catch(e){}
          }
          if(htmlPromise){
            return htmlPromise.then(function(htmlText){
              if(j && j.asset_pack_key){
                return loadAssetPack(db, String(j.asset_pack_key||''), String(j.asset_pack_profile||'')).then(function(assets){
                  return applyAssetPack(htmlText, assets);
                });
              }
              return htmlText;
            }).then(function(finalHtml){
              if(!String(finalHtml||'').trim()){ throw new Error('empty html'); }
              renderHtmlText(finalHtml);
              setStatus('Ready');
            });
          }
        }).catch(function(err){
          var code = err && err.code ? String(err.code) : '';
          if(code === 'PERMISSION_DENIED' && attempt < maxAttempts){
            return new Promise(function(res){ setTimeout(res, waitMs); }).then(function(){
              return loadGameWithRetry(db, key, attempt + 1);
            });
          }
          if(code === 'PERMISSION_DENIED'){
            setStatus('Unauthorized');
          } else {
            if(attempt < maxAttempts){
              return new Promise(function(res){ setTimeout(res, waitMs); }).then(function(){
                return loadGameWithRetry(db, key, attempt + 1);
              });
            }
            setStatus('Load error');
          }
        });
      }
      function init(){
        var s = slug();
        if(!s){ setStatus('Missing key'); return; }
        setStatus('Connecting...');
        try{
          if(typeof firebaseConfig !== 'undefined'){
            if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
          } else if(typeof window !== 'undefined' && typeof window.firebaseConfig !== 'undefined'){
            if(!firebase.apps.length){ firebase.initializeApp(window.firebaseConfig); }
          }
        }catch(e){}
        try{
          var db = firebase.database();
          var auth = firebase.auth();
          auth.signInAnonymously().then(function(cred){
            var user = cred && cred.user ? cred.user : null;
            var uid = user && user.uid;
            try{
              if(uid){
                var logRef = db.ref('access_logs').child(uid);
                logRef.set({
                  game_id: s,
                  timestamp: firebase.database.ServerValue.TIMESTAMP
                }).catch(function(){});
              }
            }catch(e){}
            try{
              if(user && typeof user.getIdToken === 'function'){
                user.getIdToken(true).then(function(){
                  return loadGameWithRetry(db, s, 0);
                }).catch(function(){
                  return loadGameWithRetry(db, s, 0);
                });
              } else {
                loadGameWithRetry(db, s, 0);
              }
            }catch(e){
              loadGameWithRetry(db, s, 0);
            }
          }).catch(function(){
            setStatus('Auth error');
          });
        }catch(e){
          setStatus('Load error');
        }
        $('#copyBtn').addEventListener('click', function(){
          try {
            var l = location.origin + '/' + s;
            navigator.clipboard.writeText(l).then(function(){ setStatus('Link copied'); });
          } catch(e){}
        });
      }
      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
